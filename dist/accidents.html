   real city/neighborhood/street (src/tree-canopy.js showPickConfirm) - the
   comparison itself often sits below the fold on a phone, so a valid pick
   otherwise gives no feedback at all until the visitor scrolls down.
   Desktop sees the chart update right there already, so this stays
   entirely out of layout there. */
.tc-pick-confirm { display: none; }
@media (max-width: 640px) {
  .tc-pick-confirm {
    display: inline-block; font-size: .78rem; font-weight: 600; color: var(--accent);
    opacity: 0; transition: opacity .25s ease;
  }
  .tc-pick-confirm.tc-pick-confirm-show { opacity: 1; }
}

/* ---------- trip-report.html ---------- */

/* .fin-export-row's own `display: flex` ties the UA [hidden] rule's
   specificity and was declared later, so it wins - hidden alone doesn't
   hide this row without this override. */
#trStopConfirm[hidden] { display: none; }

.tr-vehicle-pick { display: flex; gap: 1rem; justify-content: center; margin-block: 1rem; }
.tr-vehicle-opt {
  display: flex; align-items: center; gap: .4rem; padding: .6rem 1.2rem;
  border: 1px solid var(--border); border-radius: .6rem; cursor: pointer; font-weight: 600;
}
.tr-vehicle-opt:has(input:checked) { border-color: var(--accent); background: var(--surface); }
.tr-start-btn { font-size: 1.1rem; padding: .8rem 2rem; }
.tr-bus-line-row { text-align: center; margin-block-end: 1rem; }
.tr-bus-line-row input { width: 6rem; padding: .3rem .5rem; margin-inline-start: .3rem; }
.tr-bus-line-row .acc-hint { display: block; margin-top: .3rem; }

.tr-topbar {
  display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; align-items: baseline;
  font-weight: 600; margin-block-end: 1rem;
}
.tr-badge { font-size: 1.1rem; }
.tr-speed-row { display: flex; align-items: center; gap: .5rem; }
/* A real speed-limit road sign (תמרור) - red ring, white face, bare number,
   no unit/label - the same reason no real dashboard captions its own speed-
   limit sign either: the shape already says what it is. Current speed gets
   the same circular treatment (its own accent-colored ring, not red - that
   color means "this is the legal limit", not "this is what you're doing"),
   with the קמ"ש unit as a small label between the two circles rather than
   inside either one. */
.tr-sign {
  display: inline-flex; align-items: center; justify-content: center;
  inline-size: 2.6rem; block-size: 2.6rem; border-radius: 50%;
  background: #fff; border: 4px solid #d21f1f; color: #111;
  font-size: 1.15rem; font-weight: 700; line-height: 1; flex: none;
}
.tr-sign-speed { border-color: var(--accent); }
.tr-speed-unit { font-size: .7rem; color: var(--muted); font-weight: 400; }
.tr-start-time { font-size: .85rem; color: var(--muted); font-weight: 400; }
/* Moved below the map (see trip-report.html) - a plain centered line, not
   part of the topbar's flex row anymore. */
.tr-elapsed { text-align: center; font-weight: 600; margin-block: .8rem; }

/* Loud on purpose for its first 30s (a trip just started, worth a real
   glance), then recedes to a quiet persistent reminder rather than
   competing with the live info below it for the rest of the drive. Sticky
   so it stays at the very top of the viewport through scrolling instead of
   being scrolled past once the page fills up (map, stats, etc). Sized to
   fit the whole line without wrapping - a two-line sticky banner would eat
   even more permanent space than this already does. */
.tr-screen-warning {
  position: sticky; top: 0; z-index: 5;
  text-align: center; font-weight: 700; font-size: .95rem;
  background: var(--card); border-bottom: 1px solid var(--border);
  padding: .5rem; margin: 0 0 1rem;
  transition: font-size .3s ease, font-weight .3s ease, padding .3s ease, color .3s ease;
}
.tr-screen-warning.tr-warning-shrink { font-size: .8rem; font-weight: 400; color: var(--muted); padding: .3rem; }

/* Icon-only pause/stop - a driving screen is glanced at, not read; a bare
   glyph this size reads faster than a labelled pill button would. */
.tr-icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 4.5rem; height: 4.5rem; border-radius: 50%; font-size: 2.2rem; line-height: 1;
  border: 2px solid var(--border); background: var(--card); cursor: pointer;
  transition: transform .15s ease, border-color .15s ease;
}
.tr-icon-btn:hover:not(:disabled) { border-color: var(--accent); transform: scale(1.08); }
.tr-newtrip-btn { font-size: 1.3rem; padding: .9rem 1.8rem; }

/* Conic-gradient dial - plain CSS, no chart library, matching every other
   visual on this site. --score-deg (set in JS on every render) is the score
   as an angle out of 360°; the band class only picks the gradient's own
   color, so a dial reading 40 in the red band still visibly differs from
   one reading 95 in green, at a glance and without reading the number. */
.tr-score-row { display: flex; gap: 1.5rem; align-items: center; justify-content: center; flex-wrap: wrap; margin-block-end: 1.5rem; }
.tr-score-gauge {
  --score-deg: 360deg;
  width: 116px; height: 116px; border-radius: 50%;
  background: conic-gradient(var(--tr-score-color, var(--accent)) var(--score-deg), var(--border) var(--score-deg));
  display: flex; align-items: center; justify-content: center;
}
.tr-score-gauge.sc-great { --tr-score-color: #2e7d46; }
.tr-score-gauge.sc-good  { --tr-score-color: #8bc34a; }
.tr-score-gauge.sc-fair  { --tr-score-color: #ff8800; }
.tr-score-gauge.sc-poor  { --tr-score-color: #dd0000; }
.tr-score-inner {
  width: 90px; height: 90px; border-radius: 50%; background: var(--card);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.tr-score-inner #trScoreNum { font-size: 2rem; font-weight: 700; line-height: 1; }
/* Calm, silent "an event just logged" feedback - a brief ring pulse on the
   gauge already on screen, not a new element and not a color anyone would
   mistake for the score itself changing color. */
@keyframes tr-pulse { 0%, 100% { box-shadow: none; } 35% { box-shadow: 0 0 0 10px rgba(221, 0, 0, 0.35); } }
.tr-score-pulse { animation: tr-pulse 1.4s ease; }
.tr-score-max { font-size: .8rem; color: var(--muted); }
.tr-score-meta { max-width: 26rem; }
.tr-score-label { font-size: 1.2rem; font-weight: 700; }

.tr-map-wrap { display: flex; justify-content: center; margin-block-end: .5rem; }
.tr-map-wrap canvas { max-width: 100%; height: auto; aspect-ratio: 1 / 1; border-radius: .5rem; border: 1px solid var(--border); }
.tr-autopan-toggle { display: block; text-align: center; font-size: .85rem; color: var(--muted); margin-block-end: 2rem; }

.tr-problem-meter {
  display: flex; height: 22px; border-radius: .4rem; overflow: hidden; border: 1px solid var(--border);
  margin-block-end: .6rem;
}
.tr-meter-seg { height: 100%; }
.tr-meter-unknown {
  background: repeating-linear-gradient(45deg, var(--border), var(--border) 4px, transparent 4px, transparent 8px);
}
.tr-legend { display: flex; flex-wrap: wrap; gap: .8rem; font-size: .8rem; color: var(--muted); margin-block-end: 1.5rem; }
.tr-legend-item { display: inline-flex; align-items: center; gap: .3rem; }
.tr-legend-swatch { width: .8rem; height: .8rem; border-radius: .2rem; display: inline-block; }
.tr-legend-swatch-unknown {
  background: repeating-linear-gradient(45deg, var(--border), var(--border) 2px, transparent 2px, transparent 4px);
}

/* Smaller columns and tighter tiles than the site-wide .stat default (9rem
   min, .7rem/.85rem padding) - shrunk specifically so all six fit on one
   row instead of wrapping to a second line. */
.tr-stats-row { grid-template-columns: repeat(auto-fit, minmax(5.2rem, 1fr)); gap: .4rem; margin-block-end: 1.5rem; }
.tr-stats-row .stat { padding: .45rem .5rem; }
.tr-stats-row .stat-n { font-size: 1.3rem; }
.tr-stats-row .stat-l { font-size: .68rem; }

.tr-complete-summary p { margin-block: .4rem; }
.tr-complete-score { font-size: 1.3rem; }
.tr-complete-score.sc-great, .tr-complete-score.sc-good { color: #2e7d46; }
.tr-complete-score.sc-fair { color: #ff8800; }
.tr-complete-score.sc-poor { color: #dd0000; }

.tr-event-log { list-style: none; padding: 0; margin: 0 0 1.5rem; }
.tr-event-log li {
  display: flex; gap: .8rem; padding: .5rem 0; border-bottom: 1px solid var(--border); font-size: .9rem;
}
.tr-ev-type { font-weight: 600; }
.tr-ev-time { color: var(--muted); font-variant-numeric: tabular-nums; }

.tr-history-list { list-style: none; padding: 0; margin: 0 0 1.5rem; }
.tr-history-item {
  border: 1px solid var(--border); border-radius: .6rem; padding: .8rem 1rem; margin-block-end: .8rem;
}
.tr-history-info { display: flex; flex-wrap: wrap; gap: .6rem; justify-content: space-between; margin-block-end: .6rem; }
.tr-history-date { font-weight: 600; }

/* Civic-category pages only (.civic-app-page - accidents.html,
   area-cleanup.html, trip-report.html; tree-plans/trees are external, no
   local page to mark): the app-context strip is 30% bigger here than the
   4.6rem/2.3rem site-wide default, and always exactly two rows (grid with
   two explicit rows, auto-flowing into columns) rather than whatever
   flex-wrap happens to land at the current width - a fixed, predictable
   shape instead of a variable one. */
.civic-app-page .app-siblings {
  display: grid; grid-template-rows: repeat(2, auto); grid-auto-flow: column; gap: .5rem;
  justify-content: start;
}
.civic-app-page .app-sibling { inline-size: 5.98rem; }
.civic-app-page .app-sibling-icon { font-size: 2.99rem; }
</style>
</head>
<body class="accidents-page civic-app-page">
  <header class="site">
    <div class="wrap">
      <h1>תאונות דרכים עם נפגעים</h1>
      <span class="site-by">פרויקט של רם אגמון<span class="site-disclaimer">המידע באתר עלול להיות שגוי</span><a href="https://hod-hasharon.org/" target="_blank" rel="noopener">הירוקים הוד השרון</a></span>
      <div class="theme-pick" id="themePick" role="group" aria-label="ערכת נושא">
        <button type="button" data-theme="clouds">☀️<span class="theme-btn-label"> יום</span></button>
        <button type="button" data-theme="fashion">🌙<span class="theme-btn-label"> לילה</span></button>
        <button type="button" data-theme="zebra">🦓<span class="theme-btn-label"> זברה</span></button>
      </div>
      <span class="meta" id="computed"></span>
      <span class="meta" id="created"></span>
    </div>
  </header>

  <main class="wrap">
    <div id="app">
      <div id="appContext" class="app-context"></div>
      <section class="acc-section" aria-labelledby="natH">
        <h2 id="natH">כלל הארץ</h2>
        <div class="acc-charts">
          <figure id="accChartKilled" class="acc-chart" role="img"></figure>
          <figure id="accChartTotal" class="acc-chart total" role="img"></figure>
        </div>

        <div class="acc-year-pick">
          <label for="accYear">שנה:</label>
          <select id="accYear">
            <option value="all" selected>כל השנים (2020–2024)</option>
            <option value="2024">2024</option>
            <option value="2023">2023</option>
            <option value="2022">2022</option>

/** Shared DOM helpers. */

const el = (id) => document.getElementById(id);

/* Shared by every renderer. They live here rather than in one module because
   bundle.py flattens all sources into a single scope - a second `const num`
   anywhere would be a redeclaration, not a shadow. */

// maximumFractionDigits: 0 - every figure shown via this helper rounds to a
// whole number site-wide (revenue in thousands, area in sqm, rates per m²,
// etc.) - a fractional digit never carries enough meaning here to be worth
// the visual noise, consistently, not just for one table.
const num = (v) => (v == null ? '—' : Number(v).toLocaleString('he-IL', { maximumFractionDigits: 0 }));

/** Bytes -> a size someone can judge a download by. */
function bytes(n) {
  if (n == null || Number.isNaN(Number(n))) return '';
  const u = ['B', 'KB', 'MB', 'GB'];
  let v = Number(n), i = 0;
  while (v >= 1024 && i < u.length - 1) { v /= 1024; i += 1; }
  return `${v.toFixed(v < 10 && i ? 1 : 0)} ${u[i]}`;
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  })[c]);
}

/** Renders CkanError.kind as something a user can act on. */
function showError(node, err) {
  const messages = {
    blocked:
      'החסימה מגיעה מ-data.gov.il (403). נסה שוב בעוד מספר דקות.',
    rate_limit: 'יותר מדי בקשות. ממתין ומנסה שוב…',
    network: 'שגיאת רשת. בדוק את החיבור לאינטרנט.',
  };
  const hint = messages[err?.kind] || err?.message || 'אירעה שגיאה.';
  node.innerHTML = `<div class="notice error" dir="auto">${esc(hint)}</div>`;
  if (err) console.error(err);
}

function showInfo(node, text) {
  node.innerHTML = `<div class="notice info" dir="auto">${esc(text)}</div>`;
}

function showLoading(node, text = 'טוען…') {
  node.innerHTML = `<div class="skeleton" dir="auto">${esc(text)}</div>`;
}

const clear = (node) => { node.innerHTML = ''; };

const param = (name) => new URLSearchParams(location.search).get(name);

/** Formats an apis.json `probed` (or app `computed_at`) timestamp for display. */
function probedAt(raw) {
  const t = new Date(raw);
  if (Number.isNaN(t.getTime())) return raw;
  const date = t.toLocaleDateString('he-IL', { day: '2-digit', month: '2-digit', year: 'numeric' });
  const time = t.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
  return `${date} ${time}`;
}

/** Debounce for search-as-you-type without hammering the API. */
function debounce(fn, ms = 300) {
  let t;
  return (...args) => {
    clearTimeout(t);
    t = setTimeout(() => fn(...args), ms);
  };
}

/* ---------- CSV, built here rather than trusting an advertised download ----------
 * Shared by the data.gov.il explorer and any live-preview download button:
 * some CKAN resource downloads are WAF-challenged (see ckan.js), and some
 * data (e.g. accidents) never had a direct file link to begin with - either
 * way, datastore_search is the call already in use to show the rows, so the
 * CSV is assembled here from data actually in hand.
 */

/** RFC 4180 quoting, and a BOM so Excel reads Hebrew as UTF-8 rather than mojibake. */
function buildCsv(fields, records) {
  const cell = (v) => {
    const s = v == null ? '' : String(v);
    return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  const rows = records.map((r) => fields.map((f) => cell(r[f])).join(','));
  return `﻿${fields.map(cell).join(',')}\r\n${rows.join('\r\n')}\r\n`;
}

/**
 * `download` is ignored for cross-origin URLs, which is why file links open
 * in a tab elsewhere on this site. A blob: URL is same-origin, so here the
 * attribute does work and the browser saves rather than navigates.
 */
function saveCsv(text, name) {
  const href = URL.createObjectURL(new Blob([text], { type: 'text/csv;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = href;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(href), 10000);
}

/**
 * The theme picker. Three looks, labeled יום/לילה/זברה in the markup: "clouds"
 * (יום, default, unset data-theme), "fashion" (לילה, opt-in black/gold - see
 * [data-theme="fashion"] in style.css) and "zebra" (זברה, opt-in black/white
 * - see [data-theme="zebra"]). The choice is applied to <html> before first
 * paint by an inline script in <head> - see index.html/datagov.html - so
 * switching pages or reloading never flashes another theme first.
 */
const KEY = 'theme';
const DEFAULT = 'clouds';

function currentTheme() {
  return document.documentElement.getAttribute('data-theme') || DEFAULT;
}

function initThemePicker(root) {
  if (!root) return;

  const sync = () => {
    const active = currentTheme();
    root.querySelectorAll('button[data-theme]').forEach((b) => {
      b.setAttribute('aria-pressed', String(b.dataset.theme === active));
    });
  };

  root.querySelectorAll('button[data-theme]').forEach((b) => {
    b.addEventListener('click', () => {
      const choice = b.dataset.theme;
      if (choice === DEFAULT) document.documentElement.removeAttribute('data-theme');
      else document.documentElement.setAttribute('data-theme', choice);
      try { localStorage.setItem(KEY, choice); } catch { /* private mode, etc. - theme just won't persist */ }
      sync();
    });
  });

  sync();
}

/**
 * Portal drill-in: fire the portal's own API and render what comes back as
 * something readable.
 *
 * There is no generic parser here on purpose. Every source returns a different
 * shape - CKAN packages, nested CBS series, flat GTFS rows, GeoJSON features,
 * ArcGIS attribute records - so each gets a small explicit renderer. A generic
 * "dump any JSON as a table" would technically work and would be unreadable for
 * four of the five.
 *
 * Endpoints and shapes were probed on 2026-07-20; the weekly prober watches
 * them, so if one changes the map reports it rather than this quietly breaking.
 */

/**
 * One entry per browser-callable portal.
 *   url     - the live request, kept small; this is a preview, not a dump
 *   url     - (query) => request URL; the query is applied server-side where the
 *             API supports it, so filtering searches the whole collection rather
 *             than the 15 rows already on screen. That distinction matters: a
 *             client-side filter over GovMap would search 15 of 1,097,502 parcels.
 *   local   - set instead when the collection is small enough to arrive whole
 *             (CBS is 14 chapters) and filtering client-side is honest.
 *   total   - how many records exist overall, when the API says so
 *   columns - [key, label]; first column carries the row's identity
 *   rows    - shape-specific extraction
 */

/** Encodes a value for a CQL / SQL LIKE clause. Quotes are the injection risk. */
const like = (q) => `%${q.replace(/'/g, "''")}%`;

/** HUMRAT_TEUNA / SUG_DEREH are coded columns - values taken from the resource's
 *  own Dictionary file (MS_TAVLA 4 and 2), not guessed. */
const ACCIDENT_SEVERITY = { 1: 'קטלנית', 2: 'קשה', 3: 'קלה' };
const ACCIDENT_ROAD = {
  1: 'עירונית בצומת', 2: 'עירונית לא בצומת',
  3: 'לא-עירונית בצומת', 4: 'לא-עירונית לא בצומת', 5: 'שטח',
};
const ACCIDENTS_RESOURCE_2024 = '05d14adb-fe54-49f7-b7ce-f30348e2d959';
// Settlement code -> name. A separate dataset (Population and Immigration
// Authority), not part of the accidents resource - its own dictionary never
// spells out city names, only codes.
const SETTLEMENTS_RESOURCE = '5c78e9fa-c2e2-4771-93ff-7f400a12f7ba';
const OUTSIDE_SETTLEMENT = 'מחוץ לתחום ישוב';

/** Shared by the live preview and the CSV download, so "download what's
 *  shown" and "what's shown" can never drift apart into two answers. */
function accidentFilters(query, primed) {
  const needle = query.trim();
  if (!needle || !primed) return null;
  const codes = [...primed.entries()]
    .filter(([, name]) => name.includes(needle))
    .map(([code]) => Number(code));
  // No match still has to ask the server something, or the empty filter is
  // ignored and the request silently returns everything instead of the "no
  // results" the search text promised.
  return { SEMEL_YISHUV: codes.length ? codes : [-1] };
}

const hasPreview = (portalId) => Boolean(PREVIEWS[portalId]);

/**
 * The files under one row.
 *
 * Plain link navigations, so CORS never applies - these reach hosts a fetch()
 * could not read. Two things learned by probing rather than assuming:
 *
 * 1. The `download` attribute is ignored for cross-origin URLs. Every one of
 *    these is cross-origin, so it would have done nothing; the link opens in a
 *    new tab instead, which is also where a WAF interstitial can run.
 * 2. data.gov.il serves PDFs directly (200 application/pdf) but answers CSV and
 *    XLSX with a JavaScript WAF challenge page. A real browser passes it; an
 *    automated client does not, so this could not be verified end-to-end here.
 *    The note under the list warns rather than letting a blank page surprise.
 *
 * Size and format are shown up front - one of these is a 71 MB CSV.
 */
const WAF_FORMATS = new Set(['CSV', 'XLSX', 'XLS', 'ZIP']);

function files(list) {
  const mayChallenge = list.some((f) => WAF_FORMATS.has(f.format));
  return `
    <ul class="files">
      ${list.map((f) => `
        <li>
          <a href="${esc(f.url)}" target="_blank" rel="noopener" dir="auto">
            <span class="f-fmt">${esc(f.format)}</span>
            <span class="f-name">${esc(f.name)}</span>
            ${f.size ? `<span class="f-size">${esc(bytes(f.size))}</span>` : ''}
            ${f.rows ? '<span class="f-tag">ניתן לשאילתה</span>' : ''}
            <span class="f-go">${f.external ? '↗' : '⭳'}</span>
          </a>
        </li>`).join('')}
    </ul>
    ${mayChallenge ? `
      <p class="files-note" dir="auto">
        קבצי CSV/XLSX מוגשים דרך ה-WAF של data.gov.il. אם נפתח דף ביניים —
        המתן רגע, ההורדה מתחילה מעצמה. קבצי PDF מוגשים ישירות.
      </p>` : ''}`;
}

/**
 * A column header, interactive only where the server can actually sort by it.
 *
 * A plain <th> for the rest is deliberate. The alternative - sorting the fetched
 * page client-side - produces a header that behaves identically to its
 * neighbours while answering a different question ("first of these 50" rather
 * than "first of 1,197").
 */
function headCell(spec, key, label, state) {
  const field = spec.sortable?.[key];
  if (!field) return `<th>${esc(label)}</th>`;

  const active = state.sort === field;
  const next = active && state.dir === 'asc' ? 'desc' : 'asc';
  const mark = active ? (state.dir === 'asc' ? '▲' : '▼') : '↕';
  return `
    <th class="sortable${active ? ' sorted' : ''}" data-sort="${esc(field)}" data-dir="${next}"
        tabindex="0" role="button" aria-sort="${active ? (state.dir === 'asc' ? 'ascending' : 'descending') : 'none'}"
        title="מיון בשרת, על כל התוצאות ולא על העמוד המוצג">${esc(label)}<span class="s-mark">${mark}</span></th>`;
}

function table(spec, rows, state) {
  if (!rows.length) return '<div class="notice info" dir="auto">הבקשה הצליחה אך לא הוחזרו רשומות.</div>';
  const expandable = rows.some((r) => r._files?.length);

  return `
    <div class="matrix-wrap${spec.scroll ? ' scroll' : ''}">
      <table class="matrix preview${expandable ? ' expandable' : ''}">
        <thead><tr>
          ${expandable ? '<th class="c-x"></th>' : ''}
          ${spec.columns.map(([key, label]) => headCell(spec, key, label, state)).join('')}
        </tr></thead>
        <tbody>
          ${rows.map((r, i) => {
            const has = r._files?.length;
            return `
            <tr class="${has ? 'has-files' : ''}" ${has ? `data-row="${i}" tabindex="0" role="button"` : ''}>
              ${expandable ? `<td class="c-x">${has ? '<span class="x-mark">▾</span>' : ''}</td>` : ''}
              ${spec.columns.map(([key], c) =>
                `<td dir="auto"${c === 0 ? ' class="ident"' : ''}>${esc(r[key])}</td>`).join('')}
            </tr>
            ${has ? `
            <tr class="files-row" data-files="${i}" hidden>
              <td colspan="${spec.columns.length + 1}">${files(r._files)}</td>
            </tr>` : ''}`;
          }).join('')}
        </tbody>
      </table>
    </div>`;
}

/**
 * Page numbers to actually render: first, last, and the current one's immediate
 * neighbours. 1,197 datasets is 24 pages and 626 filtered is 13 - listing them
 * all would be a wall of numbers nobody aims at.
 */
function pageWindow(cur, last) {
  const want = [...new Set([0, cur - 1, cur, cur + 1, last])];
  return want.filter((p) => p >= 0 && p <= last).sort((a, b) => a - b);
}

/**
 * Offset paging over the whole result set - not over what was fetched. `start`
 * is a server offset, so page 5 of a filtered search is the server's page 5 of
 * that filter, which is why every control that changes the result set resets it
 * to 0: page 20 of 1,197 does not exist once a filter cuts it to 626.
 */
function pager(spec, state, total, shown) {
  if (!spec.paged || total == null || !shown) return '';
  const last = Math.ceil(total / spec.pageSize) - 1;
  if (last < 1) return '';
  const cur = Math.floor(state.start / spec.pageSize);

  const btn = (p, label) =>
    `<button type="button" class="pg${p === cur ? ' cur' : ''}" data-start="${p * spec.pageSize}"${
      p === cur ? ' aria-current="page"' : ''}>${esc(label)}</button>`;
  const dead = (label) => `<button type="button" class="pg" disabled>${esc(label)}</button>`;

  const nums = [];
  let prev = -1;
  for (const p of pageWindow(cur, last)) {
    if (prev >= 0 && p > prev + 1) nums.push('<span class="pg-gap">…</span>');
    nums.push(btn(p, String(p + 1)));
    prev = p;
  }

  return `
    <nav class="pager" aria-label="ניווט בין עמודים" dir="rtl">
      ${cur > 0 ? btn(cur - 1, 'הקודם') : dead('הקודם')}
      ${nums.join('')}
      ${cur < last ? btn(cur + 1, 'הבא') : dead('הבא')}
    </nav>`;
}

function bindPager(scope, state, reload) {
  scope.querySelectorAll('.pager .pg[data-start]').forEach((b) => {
    b.addEventListener('click', () => { state.start = Number(b.dataset.start); reload(); });
  });
}

/** The Hebrew column label behind an active sort field, for the status line. */
function sortLabel(spec, state) {
  const key = Object.keys(spec.sortable || {}).find((k) => spec.sortable[k] === state.sort);
  const col = spec.columns.find(([k]) => k === key);
  return `${col ? col[1] : state.sort} ${state.dir === 'asc' ? '↑' : '↓'}`;
}

/**
 * Wires the sortable headers. Each click re-requests with a new `sort=` rather
 * than reordering what is on screen - the whole point is that it sorts the
 * collection, not the page.
 */
function bindSort(scope, state, reload) {
  scope.querySelectorAll('th.sortable').forEach((th) => {
    const apply = () => {
      state.sort = th.dataset.sort;
      state.dir = th.dataset.dir;
      reload();
    };
    th.addEventListener('click', apply);
    th.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); apply(); }
    });
  });
}

/** Wires row expansion. Called after every render, since the table is replaced. */
function bindRows(scope) {
  scope.querySelectorAll('tr.has-files').forEach((tr) => {
    const toggle = () => {
      const target = scope.querySelector(`tr[data-files="${tr.dataset.row}"]`);
      if (!target) return;
      target.hidden = !target.hidden;
      const mark = tr.querySelector('.x-mark');
      if (mark) mark.textContent = target.hidden ? '▾' : '▴';
    };
    tr.addEventListener('click', toggle);
    tr.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
    });
  });
}

/**
 * Pages through a spec's own url()/rows()/total() until the whole filtered
 * result set is in hand, decoded exactly as the on-screen table decodes it
 * (severity, city names, ...) - so a download can never show different
 * columns or a different filter than what's on screen. A large `limit`
 * override keeps this to a handful of requests rather than one per on-screen
 * page; `spec.pageSize` stays untouched for the live table.
 */
const DUMP_PAGE = 32000;

async function fetchAllRows(spec, query, primed, onProgress) {
  const rows = [];
  let start = 0;
  // A ceiling rather than `while (true)`: if the server's own total ever
  // disagreed with what it actually returns, this would otherwise loop forever.
  for (let guard = 0; guard < 500; guard += 1) {
    const url = spec.url(query, { start, limit: DUMP_PAGE }, primed);
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    const total = spec.total(json);
    const page = spec.rows(json, primed);
    rows.push(...page);
    start += page.length;
    onProgress(rows.length, total);
    if (!page.length || rows.length >= total) break;
  }
  return rows;
}

/**
 * `home` sits on every portal/app entry but nothing ever rendered it - the
 * drill-in is where it belongs, as a source citation. The close button only
 * makes sense inline on the map, where "close" means "back to browsing
 * portals" - a dedicated page has nothing to close back to, so `standalone`
 * omits it.
 */
function drillHead(portal, standalone) {
  return `
    <div class="drill-head">
      <span class="drill-title">
        <h2 dir="auto">${esc(portal.name_he)}</h2>
        ${portal.home ? `<a class="drill-home" href="${esc(portal.home)}" target="_blank" rel="noopener">מקור הנתונים ↗</a>` : ''}
      </span>
      ${standalone ? '' : '<button type="button" class="drill-close">סגור ✕</button>'}
    </div>`;
}

/**
 * Renders into `node` for a portal (or an app whose data lives on its own
 * page - see accidents.js).
 *
 * Portals that are not browser-callable get an explanation rather than a failed
 * request - that distinction is the whole point of the map, so the drill-in has
 * to respect it instead of showing a broken panel.
 */
async function openPortal(node, portal, { standalone = false } = {}) {
  const spec = PREVIEWS[portal.id];

  if (!spec) {
    node.innerHTML = `
      <div class="drill">
        ${drillHead(portal, standalone)}
        <div class="notice info" dir="auto">
          ${portal.api_count === 0
            ? 'זהו כלי חיצוני ולא API ממשלתי — הדוח עצמו נמצא בקישור לאתר הבית שלמעלה.'
            : portal.browser_count === 0
              ? 'אף ממשק בפורטל הזה אינו ניתן לקריאה מדפדפן — ראה את הסיבה בכרטיסי הממשקים למטה.'
              : 'אין תצוגה מקדימה מוגדרת לפורטל הזה.'}
        </div>
      </div>`;
    return;
  }

  node.innerHTML = `
    <div class="drill">
      ${drillHead(portal, standalone)}
      <p class="drill-sub" dir="auto">${esc(spec.label)}${spec.more
        ? ` <a class="drill-more" href="${esc(spec.more.href)}">${esc(spec.more.label)} ←</a>` : ''}</p>
      <div class="drill-filter">
        <input type="search" class="drill-q" dir="auto" spellcheck="false"
               placeholder="${esc(spec.placeholder)}" aria-label="סינון">
        <span class="drill-scope">${spec.local ? 'סינון מקומי' : 'סינון בשרת'}</span>
        ${spec.download ? '<button type="button" class="drill-dl">הורדת CSV ⭳</button>' : ''}
      </div>
      ${spec.facets ? '<div class="drill-cols"></div>' : ''}
      <div class="drill-out"></div>
    </div>`;

  const out = node.querySelector('.drill-out');
  const input = node.querySelector('.drill-q');
  const cols = node.querySelector('.drill-cols');
  const dl = node.querySelector('.drill-dl');
  let cached = null;   // local-filter portals fetch once and re-filter in place
  let primed = null;   // spec.prime()'s result (e.g. a code -> name lookup), fetched once

  if (dl) {
    const dlLabel = dl.textContent;
    dl.addEventListener('click', async () => {
      dl.disabled = true;
      try {
        if (spec.prime && !primed) primed = await spec.prime();
        const query = input.value.trim();
        const rows = await fetchAllRows(spec, query, primed, (n, total) => {
          dl.textContent = `מוריד… ${num(n)} / ${num(total)}`;
        });
        if (!rows.length) { dl.textContent = 'אין רשומות'; return; }
        const fields = spec.columns.map(([, label]) => label);
        const csvRows = rows.map((r) => Object.fromEntries(spec.columns.map(([key, label]) => [label, r[key]])));
        const name = spec.download.filename(query).replace(/[\\/:*?"<>|]/g, '_').slice(0, 80);
        saveCsv(buildCsv(fields, csvRows), `${name}.csv`);
        dl.textContent = `✓ ${num(rows.length)} שורות`;
      } catch (err) {
        dl.textContent = err.name === 'AbortError' ? 'תם הזמן — נסה שוב' : 'ההורדה נכשלה';
        console.error(err);
      } finally {
        dl.disabled = false;
        setTimeout(() => { dl.textContent = dlLabel; }, 6000);
      }
    });
  }

  // Column sort + column filters. Sort starts unset so the first view keeps
  // CKAN's own relevance order rather than imposing one.
  const state = { sort: null, dir: 'asc', start: 0 };
  spec.facets?.forEach((f) => { state[f.key] = ''; });

  /**
   * Anything that changes *which* records match sends you back to page 1.
   * Without this, filtering while on page 20 asks the server for offset 950 of a
   * 626-row result and renders an empty table that looks like "no matches".
   */
  const fromStart = (fn) => (...args) => { state.start = 0; return fn(...args); };

  /**
   * Dropdown options are populated once, from the first unfiltered response.
   *
   * They are deliberately not refreshed afterwards: CKAN narrows search_facets
   * to match the active fq, so re-reading them after a pick would leave the
   * chosen organisation as the only option and strand the user there.
   */
  let facetOpts = null;

  function renderCols() {
    if (!cols || !facetOpts) return;
    cols.innerHTML = spec.facets.map((f) => {
      const items = facetOpts[f.field]?.items || [];
      const opts = items
        .slice()
        .sort((a, b) => b.count - a.count)
        .map((it) => `<option value="${esc(it.name)}"${state[f.key] === it.name ? ' selected' : ''}>`
          + `${esc(it.display_name || it.name)} (${num(it.count)})</option>`)
        .join('');
      return `<select class="col-f" data-key="${esc(f.key)}" aria-label="${esc(f.all)}" dir="auto">
          <option value="">${esc(f.all)}</option>${opts}
        </select>`;
    }).join('');   // No scope badge here: the one above already covers the panel.

    cols.querySelectorAll('.col-f').forEach((sel) => {
      sel.addEventListener('change', () => {
        state[sel.dataset.key] = sel.value;
        fromStart(load)(input.value.trim());
      });
    });
  }

  async function load(query) {
    out.innerHTML = `<div class="skeleton" dir="auto">שולח בקשה…${
      spec.slow && query ? ` <span class="slow-note">${esc(spec.slowNote)}</span>` : ''}</div>`;
    // Runs once per drill-in, not per keystroke - primed stays cached across
    // reloads the same way `cached` does for a local-filter portal.
    if (spec.prime && !primed) primed = await spec.prime();
    const url = spec.url(spec.local ? '' : query, state, primed);
    const t0 = performance.now();

    try {
      // A local-filter collection is fetched once; re-filtering must not re-hit
      // someone else's server for data already in hand.
      let json = spec.local ? cached : null;
      let ms = 0;
      let status = 200;
      if (!json) {
        // Without a deadline this spins forever on a slow host. GovMap's WFS
        // attribute filters are unindexed over 1.1M parcels and measured at
        // 12-40s, so the ceiling has to clear that or it would abort a request
        // that was going to succeed.
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), spec.slow ? 75000 : 25000);
        const res = await fetch(url, { signal: ctrl.signal }).finally(() => clearTimeout(timer));
        ms = Math.round(performance.now() - t0);
        status = res.status;
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        json = await res.json();
        if (spec.local) cached = json;
      }

      let rows = spec.rows(json, primed);
      const total = spec.total?.(json);

      if (spec.facetsOf && !facetOpts) {
        facetOpts = spec.facetsOf(json);
        renderCols();
      }

      if (spec.local && query) {
        const q = query.toLowerCase();
        rows = rows.filter((r) => Object.values(r).join(' ').toLowerCase().includes(q));
      }

      out.innerHTML = `
        <div class="ex-status">
          <span class="badge ok">HTTP ${status}</span>
          ${ms ? `<span class="tag">${ms} ms</span>` : '<span class="tag">מהמטמון</span>'}
          ${spec.paged && total != null && rows.length
            ? `<span class="tag" dir="auto">${num(state.start + 1)}–${num(state.start + rows.length)} מתוך ${num(total)} ${esc(spec.unit)}</span>`
            : `<span class="tag" dir="auto">${rows.length} מוצגות${
                total != null ? ` מתוך ${num(total)}` : ''} ${esc(spec.unit)}</span>`}
          ${query ? `<span class="tag" dir="auto">סינון: ${esc(query)}</span>` : ''}
          ${state.sort ? `<span class="tag" dir="auto">ממוין: ${esc(sortLabel(spec, state))}</span>` : ''}
        </div>
        ${rows.length
          ? table(spec, rows, state)
          : `<div class="notice info" dir="auto">אין תוצאות${query ? ` עבור <strong>${esc(query)}</strong>` : ' עבור הסינון שנבחר'}.</div>`}
        ${pager(spec, state, total, rows.length)}
        <p class="drill-url" dir="ltr"><code>${esc(url)}</code></p>`;
      bindRows(out);
      bindSort(out, state, fromStart(() => load(input.value.trim())));
      bindPager(out, state, () => load(input.value.trim()));
    } catch (err) {
      // A cross-origin block reaches JS as an opaque TypeError with no status.
      // Say which of the two it might be rather than inventing a cause.
      const cors = err instanceof TypeError;
      out.innerHTML = `
        <div class="notice error" dir="auto">
          ${err.name === 'AbortError'
            ? 'הבקשה חרגה מזמן ההמתנה. השרת איטי כרגע — נסה שוב, או צמצם את הסינון.'
            : cors
              ? 'הבקשה נחסמה על ידי הדפדפן (CORS) או שהרשת נכשלה — הדפדפן אינו חושף את הסיבה המדויקת.'
              : `הבקשה נכשלה: ${esc(err.message)}`}
        </div>
        <p class="drill-url" dir="ltr"><code>${esc(url)}</code></p>`;
    }
  }

  // Server-side filters hit a government host on every keystroke without this.
  const rerun = debounce(fromStart((q) => load(q)), spec.local ? 120 : 450);
  input.addEventListener('input', (e) => rerun(e.target.value.trim()));
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); fromStart(load)(input.value.trim()); }
  });

  await load('');
}

/**
 * Shared chart-rendering primitives, used by accidents.js, committees.js,
 * companies.js, local-finance.js and welfare.js.
 *
 * Until today each page kept its own copy (renderBarChart existed nearly
 * verbatim in three files; renderGroupedChart + its axis/color helpers were
 * copy-pasted whole from local-finance.js into welfare.js). That was a
 * deliberate choice early on, mirroring portal.js's per-API renderers
 * ("each returns a completely different shape") - but these three functions
 * were never actually different shapes, just different call sites. Sharing
 * them means a visual/behavioral fix (the peak-zero NaN guard below, for
 * instance - present in some copies, missing in others) now has one place
 * to land instead of three-to-five.
 *
 * What's deliberately NOT here: any page's own data-fetching or business
 * logic (what counts as "revenue", which resource to query, how to filter a
 * table row) - that part really does differ per page and stays in each
 * page's own file.
 */

/* ---------- single-series vertical bar chart -------------------------------
 * Used for: accidents.html (killed/total per year, with an active-year
 * highlight), committees.html (meetings by year/type), companies.html
 * (status/type distribution), local-finance.html (national YoY surplus).
 *
 * `entries`: [{ label, value, active? }]. `unit` is optional - the tooltip
 * only appends it when non-empty, so callers with no natural unit (a plain
 * count) don't get a trailing space. `opts.ariaLabel` and
 * `opts.emptyMessage` cover the two things that varied between the original
 * per-page copies (accidents.js set an aria-label; committees.js had a more
 * specific "no data in the selected range" empty message). */
function renderBarChart(figId, caption, entries, unit = '', colorClass = '', opts = {}) {
  const { ariaLabel, emptyMessage = 'אין נתונים להצגה.' } = opts;
  const fig = el(figId);
  if (!entries.length) { fig.innerHTML = `<figcaption>${esc(caption)}</figcaption><p class="acc-hint">${esc(emptyMessage)}</p>`; return; }
  // abs() so a signed series (local-finance's deficit years) scales the same
  // way an unsigned one does; a no-op for callers that never have negatives.
  const peak = Math.max(...entries.map((e) => Math.abs(e.value)));
  const bars = entries.map((e) => {
    const h = peak ? Math.round((Math.abs(e.value) / peak) * 150) : 0; // guards a peak of 0 -> NaN height, missing from some of the original copies
    return `
      <div class="acc-bar${e.active ? ' active' : ''}" title="${esc(e.label)}: ${num(e.value)}${unit ? ` ${esc(unit)}` : ''}">
        <div class="acc-bar-track">
          <span class="acc-bar-v">${num(e.value)}</span>
          <div class="acc-bar-fill" style="block-size:${h}px"></div>
        </div>
        <span class="acc-bar-y">${esc(e.label)}</span>
      </div>`;
  }).join('');
  fig.className = `acc-chart${colorClass ? ` ${colorClass}` : ''}`;
  if (ariaLabel) fig.setAttribute('aria-label', ariaLabel);
  else fig.removeAttribute('aria-label');
  fig.innerHTML = `<figcaption>${esc(caption)}</figcaption><div class="acc-bars">${bars}</div>`;
}

/* ---------- horizontal leaderboard ------------------------------------------
 * A ranked top-N reads far better as rows stacked top-to-bottom than as N
 * vertical bars squeezed into one fixed-height row - a different mark from
 * renderBarChart, not that same one rotated. `entries`: [{ label, value,
 * compare? , color? }] - `compare: true` renders a row in the same grayed-out
 * accent used for a compare authority everywhere else, so two authorities
 * can sit as adjacent rows per category without a legend to look up.
 * `color` (optional) overrides the bar's fill with a specific CSS color
 * instead - tree-canopy.html's comparison chart uses this to match each
 * bar to the same per-entity color used in its stat tiles/table rows,
 * rather than every bar sharing one accent regardless of which entity it
 * is. Existing callers that never pass `color` are unaffected - the class-
 * based accent/compare coloring is unchanged when it's absent. */
function renderHBarChart(figId, caption, entries, unit) {
  const fig = el(figId);
  if (!entries.length) { fig.innerHTML = `<figcaption>${esc(caption)}</figcaption><p class="acc-hint">אין נתונים להצגה.</p>`; return; }
  const peak = Math.max(...entries.map((e) => e.value));
  const rows = entries.map((e) => `
    <div class="acc-hbar${e.compare ? ' acc-hbar-compare' : ''}" title="${esc(e.label)}: ${num(e.value)} ${esc(unit)}">
      <span class="acc-hbar-y" dir="auto">${esc(e.label)}</span>
      <div class="acc-hbar-track"><div class="acc-hbar-fill" style="inline-size:${peak ? (e.value / peak) * 100 : 0}%${e.color ? `;background:${e.color}` : ''}"></div></div>
      <span class="acc-hbar-v">${num(e.value)}</span>
    </div>`).join('');
  fig.innerHTML = `<figcaption>${esc(caption)}</figcaption><div class="acc-hbars">${rows}</div>`;
}

/* ---------- grouped bar chart with an optional "compare" backdrop ----------
 * Two series (labels.front/back) per x-axis point, plus an optional second
 * entity's own two series drawn as a third, distinctly-colored bar group -
 * local-finance.html's revenue/expense-per-authority chart, reused as-is by

const citySwatchCell = (name, color) => `<td class="fin-city-cell"><span class="acc-legend-swatch" style="background:${color}"></span>${esc(name)}</td>`;

const FIN_PLOT_PX_MOBILE = 130; // shorter too, not just narrower - "smaller" on mobile means both axes, not just fitting the width
/** Checked once per render, same convention as index.html's own
 *  matchMedia('(max-width: 640px)') check for the "#more" section - not a
 *  live-updating listener, so a mid-session resize/rotation only takes
 *  effect on the NEXT re-render (a new authority/year/compare pick), not
 *  instantly. Consistent with the rest of this site rather than a special
 *  case for charts. */
const plotPx = () => (window.matchMedia('(max-width: 640px)').matches ? FIN_PLOT_PX_MOBILE : FIN_PLOT_PX_DESKTOP);

/** Rounds a peak value up to a "nice" axis maximum (1/2/2.5/5 x 10^n steps) -
 *  a gridline at 683,417 would tell a reader nothing an unlabeled bar didn't
 *  already; a gridline at 700,000 does. */
function niceAxisStep(max, targetSteps = 5) {
  if (!max || max <= 0) return { step: 1, steps: 1, axisMax: 1 };
  const roughStep = max / targetSteps;
  const magnitude = 10 ** Math.floor(Math.log10(roughStep));
  const residual = roughStep / magnitude;
  const niceResidual = residual <= 1 ? 1 : residual <= 2 ? 2 : residual <= 2.5 ? 2.5 : residual <= 5 ? 5 : 10;
  const step = niceResidual * magnitude;
  const steps = Math.ceil(max / step);
  return { step, steps, axisMax: step * steps };
}

/** Splits a point series into real years and internal gap runs (a year
 *  between the earliest and latest point that has no data of its own) - a
 *  gap gets its own dashed slot on the chart; years outside the covered span
 *  simply don't appear, since there's no "gap" to mark at the edge of what
 *  the series covers in the first place. A series with no internal gaps
 *  (welfare.html's authority data, checked directly) just returns one slot
 *  per point, same as not having this step at all. */
function buildYearSlots(points) {
  const years = points.map((p) => p.year);
  const minYear = Math.min(...years);
  const maxYear = Math.max(...years);
  const present = new Set(years);
  const slots = [];
  let gapFrom = null;
  for (let y = minYear; y <= maxYear; y++) {
    if (present.has(y)) {
      if (gapFrom != null) { slots.push({ type: 'gap', from: gapFrom, to: y - 1 }); gapFrom = null; }
      slots.push({ type: 'year', year: y });
    } else if (gapFrom == null) {
      gapFrom = y;
    }
  }
  return slots;
}

/**
 * `points`: [{ year, revenue, expense }] for the main entity (`revenue`/
 * `expense` are just the front/back series' values - the names are
 * historical, from local-finance.html's original use, and don't imply money
 * on every page: welfare.html plots recipient-category ₪ through the same
 * two fields).
 *
 * `mainName` (nullable): the main entity's own label, shown in the legend
 * and every group's hover title. Null when the chart has no single named
 * subject (welfare.html's national trend, summed across all authorities) -
 * the legend then shows just the series labels with no name prefix.
 *
 * `compare` (optional): { name, points } - a second entity's own two
 * series, drawn as a third, distinctly-colored bar group per year purely
 * for scale/comparison. Keyed by year, not assumed to line up positionally
 * with `points` - the two entities can easily cover different years.
 *
 * Color encodes WHICH ENTITY (main vs compare), not which series - which of
 * the two series a bar is (front vs back) is carried by position (front
 * always first) and a lighter tint of that entity's own color, not a second
 * hue. When `compare` is set, each year also gets a small "X% מ-<name>"
 * label: the main entity's total (front+back) as a percentage of compare's
 * same total.
 */
function renderGroupedChart(figId, caption, points, unit, mainName, labels = { front: 'הכנסות', back: 'הוצאות' }, compare = null) {
  const fig = el(figId);
  if (!points.length) { fig.innerHTML = `<figcaption>${esc(caption)}</figcaption><p class="acc-hint">אין נתונים להצגה.</p>`; return; }
  const compareByYear = new Map((compare?.points || []).map((p) => [p.year, p]));
  const peak = Math.max(
    ...points.flatMap((p) => [p.revenue, p.expense]),
    ...[...compareByYear.values()].flatMap((p) => [p.revenue, p.expense]),
  );
  const { steps, axisMax } = niceAxisStep(peak);
  const byYear = new Map(points.map((p) => [p.year, p]));
  const slots = buildYearSlots(points);
  const plotHeight = plotPx();

  const barH = (v) => (axisMax ? Math.round((v / axisMax) * plotHeight) : 0);
  const cityBars = (p, mainEntity) => `
    <div class="fin-chart-bars">
      <div class="fin-chart-bar${mainEntity ? '' : ' fin-chart-bar-compare'}" style="block-size:${barH(p.revenue)}px"></div>
      <div class="fin-chart-bar fin-chart-bar-light${mainEntity ? '' : ' fin-chart-bar-compare'}" style="block-size:${barH(p.expense)}px"></div>
    </div>`;

  const groups = slots.map((slot) => {
    if (slot.type === 'gap') {
      const label = slot.from === slot.to ? String(slot.from) : `${slot.from}-${slot.to}`;
      return `
        <div class="fin-chart-group" title="אין נתונים לשנים ${esc(label)}">
          <div class="fin-chart-gap-box" style="block-size:${plotHeight}px"></div>
          <span class="fin-chart-y fin-chart-gap-label">${esc(label)}<br>אין נתונים</span>
        </div>`;
    }
    const p = byYear.get(slot.year);
    const cmp = compareByYear.get(slot.year);
    const mainTotal = p.revenue + p.expense;
    const cmpTotal = cmp ? cmp.revenue + cmp.expense : null;
    const pct = cmp && cmpTotal ? Math.round((mainTotal / cmpTotal) * 100) : null;
    // A falsy labels.back means a genuine single-series chart (welfare.js's
    // recipients-only comparison, where `expense` is always 0 by
    // construction, not a real second series) - the back half of every
    // title/legend line is dropped rather than describing a series that
    // was never real.
    const title = `${slot.year}${mainName ? ` — ${esc(mainName)}` : ''}: ${esc(labels.front)} ${num(p.revenue)}${labels.back ? `, ${esc(labels.back)} ${num(p.expense)}` : ''} ${esc(unit)}`
      + (cmp ? `; ${esc(compare.name)}: ${esc(labels.front)} ${num(cmp.revenue)}${labels.back ? `, ${esc(labels.back)} ${num(cmp.expense)}` : ''} ${esc(unit)}` : '');
    return `
      <div class="fin-chart-group" title="${title}">
        <span class="fin-chart-pct">${pct != null ? `${pct}%<span class="fin-chart-pct-name"> מ-${esc(compare.name)}</span>` : ''}</span>
        <div class="fin-chart-bars-wrap" style="block-size:${plotHeight}px; background-size:100% ${plotHeight / steps}px">
          ${cityBars(p, true)}
          ${cmp ? cityBars(cmp, false) : ''}
        </div>
        <span class="fin-chart-y">${slot.year}</span>
      </div>`;
  }).join('');

  const axisLabels = Array.from({ length: steps + 1 }, (_, i) => axisMax - i * (axisMax / steps))
    .map((v) => `<span>${num(Math.round(v))}</span>`).join('');

  fig.className = 'acc-chart acc-chart-wide';
  fig.innerHTML = `
    <figcaption>${esc(caption)}</figcaption>
    <div class="acc-legend">
      <span class="acc-legend-item"><span class="acc-legend-swatch" style="background:var(--accent)"></span>${mainName ? `${esc(mainName)} - ` : ''}${esc(labels.front)}${labels.back ? ` (מלא, ראשון) / ${esc(labels.back)} (בהיר, שני)` : ''}</span>
      ${compare ? `<span class="acc-legend-item"><span class="acc-legend-swatch" style="background:var(--fin-compare)"></span>${esc(compare.name)} - אותו סדר</span>` : ''}
    </div>
    <div class="fin-chart-body">
      <div class="fin-chart-axis">
        <span class="fin-chart-pct">&nbsp;</span>
        <div class="fin-chart-axis-scale" style="block-size:${plotHeight}px">${axisLabels}</div>
      </div>
      <div class="fin-chart-plot">${groups}</div>
    </div>
    <p class="acc-hint">${esc(unit)}${compare && mainName ? ` - האחוז מעל כל שנה: הסה"כ של ${esc(mainName)} כאחוז מהסה"כ של ${esc(compare.name)} אותה שנה` : ''}</p>`;
}

/**
 * Shared "app card" rendering - the grid of tools built on top of (or, for
 * the tree tracker, adjacent to) a government API, as opposed to the portal/
 * API map itself. Grouped by what a visitor is actually trying to do
 * (category/category_he in apis.json), not by data source - "מי אחראי על
 * ניקיון" and "להציל עץ" have nothing in common technically, but both are
 * things a citizen might act on, so both sit under the same heading.
 *
 * Used by index.html's map (every category, above the portal/API detail) and
 * by apps.html (the same grid, its own page - see there for why a page of
 * its own is worth having).
 */

// One glyph each (occasionally a short sequence, or - trees/tree-canopy/
// tree-plans/trip-report only - a small HTML composition, see .icon-small/
// .tc-icon in style.css) - a welcoming button reads as a destination, not a
// document, so the icon carries it rather than a URL or an arrow-hint line.
// trees (small 🚑), tree-canopy (🏠 badge) and tree-plans (📋 badge) all
// start from the same 🌳 but diverge on purpose: trees is about a tree
// already in trouble (needing rescue - the ambulance is deliberately
// smaller, a detail riding along with the tree rather than an equal second
// subject), tree-canopy is about how much canopy covers a city/
// neighborhood/street - a house tucked in the corner, not a rescue call -
// and tree-plans is earlier still: a building plan (the clipboard) that
// marks trees, years before any tree-felling license (trees' own subject)
// would exist. trip-report is unrelated to the tree family (🚗, with a small
// live-score badge, not a 🌳 variant) - a live per-trip driving score, not a
// government dataset lookup. Not escaped by appCard/renderAppContext (both
// interpolate this directly, no esc()), so raw markup here renders as real
// HTML, not text.
const APP_ICON = {
  accidents: '🚦', trees: '🌳<span class="icon-small">🚑</span>', committees: '🏛️',
  'local-finance': '💰', agriculture: '🌾',
  companies: '🏢', welfare: '🤝', budgetkey: '🔑', 'blue-lines': '🚇', 'area-cleanup': '🧹',
  'tree-canopy': '<span class="tc-icon">🌳<span class="tc-icon-badge">🏠</span></span>',
  'tree-plans': '🌳<span class="icon-small">📋</span>',
  'trip-report': '🚗<span class="icon-small">🎯</span>',
};

// Render order for categories - not alphabetical on the Hebrew label, and
// not apis.json's own app order. Whatever's tied to your own address first,
// then civic-action items (things asking something OF you), then money/
// accountability. A category outside this list still renders (under its
// own heading, after these) rather than silently dropping its apps.
const CATEGORY_ORDER = ['home', 'civic', 'money'];

// The native hover tooltip (title=) can't be styled - the browser draws it,
// wrapping to as many lines as the full `about` text needs (some run past
// 500 characters). A single short line reads on hover before the tooltip
// even finishes rendering; the full text is one click away on the app's own
// page anyway; splitting on the first ". " keeps it to one real sentence
// rather than cutting mid-word, with a hard length cap as a backstop for
// entries whose first sentence alone still runs long.
const HOVER_MAX = 90;
function oneLineSummary(about) {
  const firstSentence = about.split('. ')[0];
  return firstSentence.length <= HOVER_MAX ? firstSentence : `${firstSentence.slice(0, HOVER_MAX)}…`;
}

function appCard(a) {
  return `
    <a class="app-tile" href="${esc(a.href)}"${a.external ? ' target="_blank" rel="noopener"' : ''}
       title="${esc(oneLineSummary(a.about))}" dir="auto">
      <span class="app-icon" aria-hidden="true">${APP_ICON[a.id] || '🔗'}</span>
      <span class="app-name" dir="auto">${esc(a.name_he)}</span>
    </a>`;
}

/**
 * Groups `apps` by category and renders one <section> per category into
 * `node` - a heading plus its own .apps-grid, not one flat grid with no
 * structure. An app with no category (shouldn't happen - every entry in
 * apis.json carries one - but a missing field must not make an app vanish)
 * falls into a catch-all "אחר" group at the end.
 */
function renderAppsByCategory(node, apps) {
  const byCategory = new Map();
  for (const a of apps) {
    const key = a.category || 'other';
    if (!byCategory.has(key)) byCategory.set(key, { label: a.category_he || 'אחר', items: [] });
    byCategory.get(key).items.push(a);
  }
  const orderedKeys = [
    ...CATEGORY_ORDER.filter((k) => byCategory.has(k)),
    ...[...byCategory.keys()].filter((k) => !CATEGORY_ORDER.includes(k)),
  ];

  node.innerHTML = orderedKeys.map((key) => {
    const { label, items } = byCategory.get(key);
    return `
      <section class="apps-category" aria-labelledby="appsCat-${esc(key)}">
        <h3 class="apps-category-h" id="appsCat-${esc(key)}" dir="auto">${esc(label)}</h3>
        <div class="apps-grid">${items.map(appCard).join('')}</div>
      </section>`;
  }).join('');
}

/**
 * apis.json isn't inlined into the browser bundle the same way for every
 * page - some embed it (globalThis.__API_DATA__, set by bundle.py), others
 * are served and fetch it live. One shared loader means every page that
 * wants app data (this context strip, or anything else in future) doesn't
 * re-implement the same fallback.
 */
async function loadAppsData() {
  if (globalThis.__API_DATA__) return globalThis.__API_DATA__;
  const res = await fetch(new URL('../apis.json', import.meta.url));
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

/**
 * Renders, under an app's own page header, a 🏠 icon back to apps.html (the
 * full list, every category) plus small icon-links to every OTHER app in the
 * same category as `currentId` (the current one shown too, but inert - "you
 * are here" - not a link to itself). Cross-navigation between related tools
 * without hand-maintaining it per page.
 */
function renderAppContext(node, apps, currentId) {
  const current = apps.find((a) => a.id === currentId);
  if (!current) { node.innerHTML = ''; return; }
  const inCategory = apps.filter((a) => a.category === current.category);

  const homeHtml = `
    <a class="app-sibling" href="./apps.html" title="כל האפליקציות" dir="auto">
      <span class="app-sibling-icon" aria-hidden="true">🏠</span>
      <span class="app-sibling-label">כל האפליקציות</span>
    </a>`;

  const siblingsHtml = inCategory.map((a) => (a.id === currentId
    ? `<span class="app-sibling app-sibling-current" title="${esc(a.name_he)}" aria-current="page" dir="auto">
         <span class="app-sibling-icon" aria-hidden="true">${APP_ICON[a.id] || '🔗'}</span>
         <span class="app-sibling-label">${esc(a.name_he)}</span>
       </span>`
    : `<a class="app-sibling" href="${esc(a.href)}"${a.external ? ' target="_blank" rel="noopener"' : ''}
         title="${esc(a.name_he)}" dir="auto">
         <span class="app-sibling-icon" aria-hidden="true">${APP_ICON[a.id] || '🔗'}</span>
         <span class="app-sibling-label">${esc(a.name_he)}</span>
       </a>`)).join('');

  node.innerHTML = `
    <nav class="app-siblings" aria-label="אפליקציות נוספות ב${esc(current.category_he || '')}">
      ${homeHtml}${siblingsHtml}
    </nav>`;
}

/**
 * Entry point for accidents.html.
 *
 * This app has its own page rather than a slot in the map's portal grid: it
 * isn't a government API in itself (the underlying API is data.gov.il's, and
 * is catalogued under that portal on the map) - it's a thing built on top of
 * one. openPortal() is reused as-is from portal.js in standalone mode, so
 * the live table, search-by-city and CSV download are exactly the same code
 * already exercised on the map, just given a page of its own.
 */






initThemePicker(el('themePick'));

// When this page itself was built/published, distinct from "מחושב" (when the
// data was computed). document.lastModified is the file's Last-Modified - the
// GitHub Pages deploy time when served, the file's mtime when opened offline.
const built = new Date(document.lastModified);
if (!Number.isNaN(built.getTime())) {
  el('created').textContent = `נוצר: ${probedAt(document.lastModified)}`;
  el('created').title = built.toISOString();
}

/**
 * Severity counts by year, computed once against the live DataStore (all
 * 49,941 records across the five per-year resources, paginated past the
 * API's 10,000-row page cap) rather than recalculated in-browser on every
 * visit - the same "snapshot fact, dated" pattern as the about/notes text
 * elsewhere in apis.json. See apps[].computed_at for when.
 */
const YEAR_STATS = {
  all:  { fatal: 1684, severe: 11253, light: 37004, total: 49941 },
  2024: { fatal: 405, severe: 2452, light: 5458, total: 8315 },
  2023: { fatal: 338, severe: 2374, light: 6120, total: 8832 },
  2022: { fatal: 319, severe: 2320, light: 7765, total: 10404 },
  2021: { fatal: 336, severe: 2208, light: 9010, total: 11554 },
  2020: { fatal: 286, severe: 1899, light: 8651, total: 10836 },
};

/**
 * CITY_ROWS (src/city-stats.js) packs each settlement flat to stay small;
 * unpack it here into the {fatal,severe,light,total} shape the tiles and the
 * table read, and sum the all-years figures once. Same dated snapshot as
 * YEAR_STATS - its per-city sums validate against the national totals above -
 * so it is dated by the very same apps[].computed_at, not a second live query.
 * SEMEL_YISHUV code -> { name, all-years total, per-year totals }.
 */
const CITY_STATS = {};
for (const [code, row] of Object.entries(CITY_ROWS)) {
  const years = {};
  const all = { fatal: 0, severe: 0, light: 0, total: 0 };
  CITY_YEARS.forEach((y, i) => {
    const fatal = row[1 + i * 3], severe = row[2 + i * 3], light = row[3 + i * 3];
    years[y] = { fatal, severe, light, total: fatal + severe + light };
    all.fatal += fatal; all.severe += severe; all.light += light;
    all.total += years[y].total;
  });
  CITY_STATS[code] = { name: row[0], all, years };
}

// Typed city name -> its code, for the autocomplete lookup. Settlement names
// are unique in the source list; a later duplicate would just win, harmlessly.
const CITY_BY_NAME = new Map(
  Object.entries(CITY_STATS).map(([code, c]) => [c.name, code]));

// Newest year first: a table is read top-down, so the most recent row leads.
const CITY_TABLE_YEARS = ['2024', '2023', '2022', '2021', '2020'];

// A city's all-years totals as the same four tiles the national section uses,
// so "the total for this city" reads in the exact visual vocabulary above it.
function renderCityStats(s) {
  el('cityStats').innerHTML = `
    <div class="stat bad">
      <span class="stat-n">${num(s.fatal)}</span>
      <span class="stat-l">הרוגים (תאונות קטלניות)</span>
    </div>
    <div class="stat warn">
      <span class="stat-n">${num(s.severe)}</span>
      <span class="stat-l">פצועים קשה</span>
    </div>
    <div class="stat ok">
      <span class="stat-n">${num(s.light)}</span>
      <span class="stat-l">פצועים קל</span>
    </div>
    <div class="stat">
      <span class="stat-n">${num(s.total)}</span>
      <span class="stat-l">סה"כ תאונות עם נפגעים</span>
    </div>`;
}

// The per-year breakdown for one city, under its total tiles.
function renderCityTable(city) {
  const rows = CITY_TABLE_YEARS.map((y) => {
    const v = city.years[y];
    return `
      <tr>
        <th scope="row">${y}</th>
        <td>${num(v.fatal)}</td>
        <td>${num(v.severe)}</td>
        <td>${num(v.light)}</td>
        <td>${num(v.total)}</td>
      </tr>`;
  }).join('');
  el('cityTable').innerHTML = `
    <div class="matrix-wrap">
      <table class="matrix">
        <thead>
          <tr>
            <th scope="col">שנה</th>
            <th scope="col">הרוגים</th>
            <th scope="col">פצועים קשה</th>
            <th scope="col">פצועים קל</th>
            <th scope="col">סה"כ</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

function renderCity(code) {
  const city = CITY_STATS[code];
  renderCityStats(city.all);
  renderCityTable(city);
}

// The panel before any city is chosen (and whenever the text isn't yet a whole
// city name): a prompt, not stale numbers from a previous pick.
function showCityPrompt() {
  el('cityStats').innerHTML = '';
  el('cityTable').innerHTML =
    '<p class="acc-hint">התחילו להקליד שם ישוב כדי לראות את הפירוט לפי שנה.</p>';
}

// A hand-rolled suggestion dropdown, not a native <datalist>: the latter's
// popup is drawn by the OS/browser itself and ignores the page's dir="rtl" -
// on Linux/GTK builds of Chrome it shows up left-anchored and LTR regardless
// of the surrounding page, which isn't fixable from CSS. Rendering our own
// <ul> keeps every pixel of it under our styling, RTL included.
const cityInput = el('cityInput');
const cityMenu = el('cityMenu');
// Most-accidents-first (Object insertion order = CITY_ROWS order), same order
// the datalist used to offer suggestions in.
const CITY_LIST = Object.entries(CITY_STATS).map(([code, c]) => ({ code, name: c.name }));
const CITY_MENU_MAX = 8;

let cityMatches = [];
let cityActive = -1;

function closeCityMenu() {
  cityMenu.hidden = true;
  cityMenu.innerHTML = '';
  cityMatches = [];
  cityActive = -1;
  cityInput.setAttribute('aria-expanded', 'false');
  cityInput.removeAttribute('aria-activedescendant');
}

function renderCityMenu() {
  cityMenu.innerHTML = cityMatches.map((c, i) => `
    <li role="option" id="cityopt-${i}" data-code="${c.code}"
        class="${i === cityActive ? 'active' : ''}">${esc(c.name)}</li>`).join('');
  cityMenu.hidden = false;
  cityInput.setAttribute('aria-expanded', 'true');
  if (cityActive >= 0) cityInput.setAttribute('aria-activedescendant', `cityopt-${cityActive}`);
  else cityInput.removeAttribute('aria-activedescendant');
}

function selectCity(code, name) {
  cityInput.value = name;
  renderCity(code);
  closeCityMenu();
}

// Empty by default; only an exact match to a known name resolves - a partial
// string shows the prompt rather than guessing a city.
function onCityInput() {
  const q = cityInput.value.trim();
  const code = CITY_BY_NAME.get(q);
  if (code) renderCity(code);
  else showCityPrompt();

  if (!q) { closeCityMenu(); return; }
  cityMatches = CITY_LIST.filter((c) => c.name.includes(q)).slice(0, CITY_MENU_MAX);
  cityActive = -1;
  if (cityMatches.length) renderCityMenu();
  else closeCityMenu();
}
showCityPrompt();
cityInput.addEventListener('input', onCityInput);

cityInput.addEventListener('keydown', (e) => {
  if (cityMenu.hidden) return;
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    cityActive = Math.min(cityActive + 1, cityMatches.length - 1);
    renderCityMenu();
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    cityActive = Math.max(cityActive - 1, 0);
    renderCityMenu();
  } else if (e.key === 'Enter' && cityActive >= 0) {
    e.preventDefault();
    const m = cityMatches[cityActive];
    selectCity(m.code, m.name);
  } else if (e.key === 'Escape') {
    closeCityMenu();
  }
});

// mousedown, not click: it fires before the input's blur, and preventDefault
// here stops that blur from happening at all, so the menu is still there for
// this same handler to read from when the tap/click lands.
cityMenu.addEventListener('mousedown', (e) => {
  const li = e.target.closest('li');
  if (!li) return;
  e.preventDefault();
  selectCity(li.dataset.code, li.textContent);
});

cityInput.addEventListener('blur', closeCityMenu);

// Years oldest→newest in the DOM; on this RTL page the flow lays them out
// right→left, so time reads the same direction as the Hebrew around it -
// oldest (2020) on the right, newest (2024) on the left.
const CHART_YEARS = ['2020', '2021', '2022', '2023', '2024'];

// Two single-series bar charts side by side, each its own hue (fatalities in
// the danger red of the "killed" tile, all accidents in the neutral accent) -
// one series apiece, so no legend, the caption names it. Bars share a zero
// baseline and are labelled directly, so each plot carries its own numbers.
// A picked year lights its bar in both and recedes the rest, echoing the
// dropdown; the two charts stay on the same y-scale is NOT wanted - each is
// keyed to its own peak, since killed and total counts differ by two orders.
function renderChart(figId, caption, unit, valueOf, year) {
  const entries = CHART_YEARS.map((y) => ({ label: y, value: valueOf(y), active: year !== 'all' && year === y }));
  renderBarChart(figId, caption, entries, unit, '', {
    ariaLabel: `${caption}, ${CHART_YEARS[0]}–${CHART_YEARS[CHART_YEARS.length - 1]}`,
  });
}

function renderCharts(year) {
  renderChart('accChartKilled', 'הרוגים לפי שנה', 'הרוגים',
    (y) => YEAR_STATS[y].fatal, year);
  renderChart('accChartTotal', 'מספר התאונות לפי שנה', 'תאונות',
    (y) => YEAR_STATS[y].total, year);
}

function renderStats(year) {
  const s = YEAR_STATS[year] || YEAR_STATS.all;
  el('accStats').innerHTML = `
    <div class="stat bad">
      <span class="stat-n">${num(s.fatal)}</span>
      <span class="stat-l">הרוגים (תאונות קטלניות)</span>
    </div>
    <div class="stat warn">
      <span class="stat-n">${num(s.severe)}</span>
      <span class="stat-l">פצועים קשה</span>
    </div>
    <div class="stat ok">
      <span class="stat-n">${num(s.light)}</span>
      <span class="stat-l">פצועים קל</span>
    </div>
    <div class="stat">
      <span class="stat-n">${num(s.total)}</span>
      <span class="stat-l">סה"כ תאונות עם נפגעים</span>
    </div>`;
}

renderCharts('all');
renderStats('all');
el('accYear').addEventListener('change', (e) => {
  renderCharts(e.target.value);
  renderStats(e.target.value);
});

async function load() {
  const mount = el('accidents');
  try {
    const data = await loadAppsData();
    renderAppContext(el('appContext'), data.apps, 'accidents');
    const app = data.apps.find((a) => a.id === 'accidents');
    if (!app) throw new Error('accidents app entry not found in apis.json');
    if (app.computed_at) {
      el('computed').textContent = `מחושב: ${probedAt(app.computed_at)}`;
      el('computed').title = app.computed_at;
    }
    await openPortal(mount, app, { standalone: true });
  } catch (err) {
    mount.innerHTML = `<div class="notice error">טעינת הנתונים נכשלה: ${esc(err.message)}</div>`;
  }
}

load();

</script>
</body>
</html>
